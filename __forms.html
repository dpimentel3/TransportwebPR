<!DOCTYPE html>
<!--
  Static form definition for Netlify's build-time form detection only.
  This page is not linked anywhere and is not meant to be viewed by visitors.
  The real, interactive booking form lives on the tour pages and submits via
  AJAX; this file guarantees Netlify registers every field the form can send,
  including the "Time slot" field used by tours like Scuba Diving and Snorkel
  With Turtles, and the "Departure time" / "Trip length" pair sent by the boat
  charter form.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Form definitions</title>
  </head>
  <body>
    <form name="tour-booking-v2" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="tour-booking-v2" />
      <label for="tb_bot">Don't fill this out if you're human: <input id="tb_bot" name="bot-field" /></label>
      <label for="tb_tripDate">Date (month/day)</label>
      <input id="tb_tripDate" name="tripDate" type="date" />
      <label for="tb_tour">Select tour</label>
      <input id="tb_tour" name="tour" type="text" />
      <label for="tb_pickupLocation">Pick up location</label>
      <input id="tb_pickupLocation" name="pickupLocation" type="text" />
      <label for="tb_timeSlot">Time slot</label>
      <input id="tb_timeSlot" name="timeSlot" type="text" />
      <label for="tb_passengers">Number of passengers</label>
      <input id="tb_passengers" name="passengers" type="number" />
      <label for="tb_phone">Phone number</label>
      <input id="tb_phone" name="phone" type="tel" />
      <label for="tb_firstName">First name</label>
      <input id="tb_firstName" name="firstName" type="text" />
      <label for="tb_comments">Comments</label>
      <textarea id="tb_comments" name="comments"></textarea>
    </form>
    <form name="tour-booking-timeslots" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="tour-booking-timeslots" />
      <label for="ts_bot">Don't fill this out if you're human: <input id="ts_bot" name="bot-field" /></label>
      <label for="ts_tripDate">Date (month/day)</label>
      <input id="ts_tripDate" name="tripDate" type="date" />
      <label for="ts_tour">Select tour</label>
      <input id="ts_tour" name="tour" type="text" />
      <label for="ts_pickupLocation">Pick up location</label>
      <input id="ts_pickupLocation" name="pickupLocation" type="text" />
      <label for="ts_timeSlot">Time slot</label>
      <input id="ts_timeSlot" name="timeSlot" type="text" />
      <label for="ts_passengers">Number of passengers</label>
      <input id="ts_passengers" name="passengers" type="number" />
      <label for="ts_phone">Phone number</label>
      <input id="ts_phone" name="phone" type="tel" />
      <label for="ts_firstName">First name</label>
      <input id="ts_firstName" name="firstName" type="text" />
      <label for="ts_comments">Comments</label>
      <textarea id="ts_comments" name="comments"></textarea>
    </form>
    <form name="boat-charter-booking" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="boat-charter-booking" />
      <label for="bc_bot">Don't fill this out if you're human: <input id="bc_bot" name="bot-field" /></label>
      <label for="bc_tripDate">Date (month/day)</label>
      <input id="bc_tripDate" name="tripDate" type="date" />
      <label for="bc_charter">Boats and Charters</label>
      <input id="bc_charter" name="charter" type="text" />
      <label for="bc_departureTime">Departure time</label>
      <input id="bc_departureTime" name="departureTime" type="text" />
      <label for="bc_tripLength">Trip length</label>
      <input id="bc_tripLength" name="tripLength" type="text" />
      <label for="bc_passengers">Number of passengers</label>
      <input id="bc_passengers" name="passengers" type="number" />
      <label for="bc_phone">Phone number</label>
      <input id="bc_phone" name="phone" type="tel" />
      <label for="bc_email">Email</label>
      <input id="bc_email" name="email" type="email" />
      <label for="bc_firstName">First name</label>
      <input id="bc_firstName" name="firstName" type="text" />
      <label for="bc_comments">Comments</label>
      <textarea id="bc_comments" name="comments"></textarea>
    </form>
    <form name="ferry-booking" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="ferry-booking" />
      <label for="fb_bot">Don't fill this out if you're human: <input id="fb_bot" name="bot-field" /></label>
      <label for="fb_destination">Destination</label>
      <input id="fb_destination" name="destination" type="text" />
      <label for="fb_departureDate">Departure date</label>
      <input id="fb_departureDate" name="departureDate" type="date" />
      <label for="fb_returnDate">Return date</label>
      <input id="fb_returnDate" name="returnDate" type="date" />
      <label for="fb_departureTime">Departure time</label>
      <input id="fb_departureTime" name="departureTime" type="text" />
      <label for="fb_returnTime">Return time</label>
      <input id="fb_returnTime" name="returnTime" type="text" />
      <label for="fb_passengers">Number of passengers</label>
      <input id="fb_passengers" name="passengers" type="number" />
      <label for="fb_phone">Phone number</label>
      <input id="fb_phone" name="phone" type="tel" />
      <label for="fb_email">Email</label>
      <input id="fb_email" name="email" type="email" />
      <label for="fb_fullName">Full name</label>
      <input id="fb_fullName" name="fullName" type="text" />
      <label for="fb_comments">Comments</label>
      <textarea id="fb_comments" name="comments"></textarea>
    </form>
  </body>
</html>
